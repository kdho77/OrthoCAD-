name: Test

on:
    push:
        branches: ["main", "ci/shard-unit-tests"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

# A newer commit on the same PR makes its previous check run obsolete.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        if: github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 75
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, 6]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Install vertex app dependencies
              run: npm install --prefix vertex

            - name: Generate Prisma client (vertex)
              run: npm run prisma:generate --prefix vertex

            # procedural-wall-style.test.ts shells out to tests/helpers/stl-gates.py.
            # ubuntu-latest has python3 but not trimesh; without this the required
            # job dies on ModuleNotFoundError instead of reporting STL gates.
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install STL-gate Python deps
              run: python3 -m pip install "trimesh>=4.0" "scipy>=1.11"

            - name: Materialize incoming element binaries
              run: python3 scripts/materialize-incoming-elements.py

            - name: Validate unit test shard manifest
              run: node scripts/ci/validate-unit-test-shards.mjs

            - name: Run unit tests (shard ${{ matrix.shard }}/6)
              run: node scripts/ci/run-unit-test-shard.mjs ${{ matrix.shard }}

    test-and-deploy:
        # Branch protection gates on this job name; it aggregates shard results.
        if: always() && github.event_name != 'workflow_dispatch'
        needs: unit-tests
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Install vertex app dependencies
              run: npm install --prefix vertex

            - name: Generate Prisma client (vertex)
              run: npm run prisma:generate --prefix vertex

            - name: Assert server entry boots under plain Node ESM
              run: node vertex/scripts/assert-server-esm-boot.mjs

            - name: Require all unit test shards to pass
              run: |
                  if [ "${{ needs.unit-tests.result }}" != "success" ]; then
                      echo "unit-tests result: ${{ needs.unit-tests.result }}"
                      exit 1
                  fi

    # Optional diagnostic: run manually from Actions when investigating residuals.
    default-procedural-smoke:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Install vertex app dependencies
              run: npm install --prefix vertex

            - name: Generate Prisma client (vertex)
              run: npm run prisma:generate --prefix vertex

            - name: Report Default procedural residuals
              run: npx rstest --config rstest.optional.config.ts tests/procedural-wall-s1-default-procedural.optional.test.ts
