name: Test

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

# A newer commit on the same PR makes its previous check run obsolete.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test-and-deploy:
        # Manual dispatch is reserved for the optional procedural smoke test.
        if: github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 90

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Install vertex app dependencies
              run: npm install --prefix vertex

            - name: Generate Prisma client (vertex)
              run: npm run prisma:generate --prefix vertex

            # procedural-wall-style.test.ts shells out to tests/helpers/stl-gates.py.
            # ubuntu-latest has python3 but not trimesh; without this the required
            # job dies on ModuleNotFoundError instead of reporting STL gates.
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install STL-gate Python deps
              run: python3 -m pip install "trimesh>=4.0" "scipy>=1.11"

            - name: Materialize incoming element binaries
              run: python3 scripts/materialize-incoming-elements.py

            - name: Assert server entry boots under plain Node ESM
              run: node vertex/scripts/assert-server-esm-boot.mjs

            - name: Run unit tests
              run: npm run test

    # Optional diagnostic: run manually from Actions when investigating residuals.
    default-procedural-smoke:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Install vertex app dependencies
              run: npm install --prefix vertex

            - name: Generate Prisma client (vertex)
              run: npm run prisma:generate --prefix vertex

            - name: Report Default procedural residuals
              run: npx rstest --config rstest.optional.config.ts tests/procedural-wall-s1-default-procedural.optional.test.ts
