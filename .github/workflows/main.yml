name: Test

on:
    push:
        branches: ["main", "ci/shard-unit-tests"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

# A newer commit on the same PR makes its previous check run obsolete.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, 6]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Install vertex app dependencies
              run: npm install --prefix vertex

            - name: Generate Prisma client (vertex)
              run: npm run prisma:generate --prefix vertex

            # procedural-wall-style.test.ts shells out to tests/helpers/stl-gates.py.
            # ubuntu-latest has python3 but not trimesh; without this the required
            # job dies on ModuleNotFoundError instead of reporting STL gates.
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install STL-gate Python deps
              run: python3 -m pip install "trimesh>=4.0" "scipy>=1.11"

            - name: Materialize incoming element binaries
              run: python3 scripts/materialize-incoming-elements.py

            - name: Validate unit test shard manifest
              run: node scripts/ci/validate-unit-test-shards.mjs

            - name: Run unit tests (shard ${{ matrix.shard }}/6)
              run: node scripts/ci/run-unit-test-shard.mjs ${{ matrix.shard }}

    # Required acceptance. The unit shards exclude *.optional.test.ts on purpose.
    # This job runs that file against a synthetic local Postgres and fails closed.
    isolated-postgres-acceptance:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: orthocad_test
                    POSTGRES_PASSWORD: orthocad_test
                    POSTGRES_DB: orthocad_width
                ports:
                    - 54329:5432
                options: >-
                    --health-cmd "pg_isready -U orthocad_test -d orthocad_width"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Install vertex app dependencies
              run: npm install --prefix vertex

            - name: Generate Prisma client (vertex)
              run: npm run prisma:generate --prefix vertex

            - name: Run isolated PostgreSQL acceptance
              env:
                  ORTHOCAD_ISOLATED_PG_ACCEPTANCE: "1"
                  ORTHOCAD_ISOLATED_PG_URL: postgresql://orthocad_test:orthocad_test@127.0.0.1:54329/orthocad_width
                  DATABASE_URL: ""
                  DIRECT_URL: ""
              run: node scripts/ci/isolated-postgres-acceptance.mjs run

    test-and-deploy:
        # Branch protection gates on this job name; it aggregates shard results
        # and the isolated PostgreSQL acceptance job.
        if: always()
        needs: [unit-tests, isolated-postgres-acceptance]
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Install vertex app dependencies
              run: npm install --prefix vertex

            - name: Generate Prisma client (vertex)
              run: npm run prisma:generate --prefix vertex

            - name: Assert server entry boots under plain Node ESM
              run: node vertex/scripts/assert-server-esm-boot.mjs

            - name: Require unit shards and isolated PostgreSQL acceptance
              run: |
                  if [ "${{ needs.unit-tests.result }}" != "success" ] || [ "${{ needs.isolated-postgres-acceptance.result }}" != "success" ]; then
                      echo "unit-tests result: ${{ needs.unit-tests.result }}"
                      echo "isolated-postgres-acceptance result: ${{ needs.isolated-postgres-acceptance.result }}"
                      exit 1
                  fi

    # Optional diagnostic: run manually from Actions when investigating residuals.
    default-procedural-smoke:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Install vertex app dependencies
              run: npm install --prefix vertex

            - name: Generate Prisma client (vertex)
              run: npm run prisma:generate --prefix vertex

            - name: Report Default procedural residuals
              run: npx rstest --config rstest.optional.config.ts tests/procedural-wall-s1-default-procedural.optional.test.ts
